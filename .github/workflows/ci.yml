name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Backend dependencies
        working-directory: node-react/backend
        run: bun install
      - name: Backend typecheck
        working-directory: node-react/backend
        run: bunx tsc --noEmit
      - name: Backend tests
        working-directory: node-react/backend
        run: bun test
      - name: Frontend dependencies
        working-directory: node-react/frontend
        run: bun install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: node-react/frontend
        run: bunx tsc --noEmit
      - name: Frontend tests
        working-directory: node-react/frontend
        run: bun test
      - name: Frontend build
        working-directory: node-react/frontend
        run: bun run build
